version: '3.8'

services:
  # 1. PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: dhaka-tesla-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dhaka_tesla_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dhaka_tesla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhaka-tesla-backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/dhaka_tesla_db?schema=public"
      PORT: 5000
      JWT_SECRET: "dhaka_tesla_pool_super_secret_jwt_key_2026"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Next.js Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhaka-tesla-frontend
    restart: on-failure
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
